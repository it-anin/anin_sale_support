<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Branch Button Designs</title><style>
*{box-sizing:border-box}body{margin:0;padding:32px;background:#f5f1ea;color:#29251f;font:16px Arial,sans-serif}h1{text-align:center}.grid{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.card{background:white;border-radius:18px;padding:20px;box-shadow:0 6px 20px #0001}.demo{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.b{border:0;cursor:pointer;padding:11px 16px;font-weight:700}.b small{margin-left:5px;opacity:.7}.d1{border-radius:999px;background:#9a6a2f;color:white}.d1:not(:first-child){background:#f2e7d2;color:#75542d}.d2{border-radius:10px;background:#172b4d;color:#fff}.d2:not(:first-child){background:#e6edf7;color:#172b4d}.d3{border-radius:4px;background:#31a68a;color:#fff}.d3:not(:first-child){background:#e4f4ef;color:#207b68}.d4{border-radius:0;background:#222;color:#fff}.d4:not(:first-child){background:#eee;color:#222}.d5{border-radius:14px;background:#e85d75;color:white;box-shadow:0 4px 0 #b83a51}.d5:not(:first-child){background:#ffe3e8;color:#b83a51;box-shadow:none}.d6{border:2px solid #6c5ce7;background:#6c5ce7;color:#fff;border-radius:8px}.d6:not(:first-child){background:white;color:#6c5ce7}.d7{background:linear-gradient(135deg,#ff9f43,#ee5253);color:white;border-radius:30px}.d7:not(:first-child){background:#fff0e8;color:#d95735}.d8{background:#eef2f7;color:#344054;border-radius:12px;box-shadow:inset 0 0 0 1px #d0d5dd}.d8:not(:first-child){background:white}.d9{background:#123;color:#fff;border-radius:50px;padding:12px 20px}.d9:not(:first-child){background:#d9efff;color:#14527d}.d10{background:#fff;color:#167c80;border:2px dashed #167c80;border-radius:8px}.d10:not(:first-child){color:#777;border-color:#bbb}a{color:#9a6a2f}</style></head><body><h1>ดีไซน์ปุ่มเลือกสาขา 10 แบบ</h1><p style="text-align:center">ตัวอย่าง SRC / KKL / SSS · กดปุ่มเพื่อดูสถานะ hover</p><div class="grid">
<script>const names=['Pill Gold','Navy Soft','Mint Flat','Mono Square','Coral Lift','Violet Outline','Sunset Gradient','Soft Card','Ocean Capsule','Dashed Minimal'];document.write(names.map((n,i)=>`<section class="card"><h2>แบบ ${i+1} — ${n}</h2><div class="demo d${i+1}"><button class="b">SRC <small>12</small></button><button class="b">KKL <small>5</small></button><button class="b">SSS <small>8</small></button></div><p><a href="branch-button-design-${String(i+1).padStart(2,'0')}.html">เปิดไฟล์แยก</a></p></section>`).join(''))</script></div></body></html>
